version: 2

# The five silver tables of the SEC as ClickHouse reads them. The task pin_lake of the DAG
# marts_build re-creates each table, bound to one exact Iceberg metadata file, before the models
# are built (blueprint 5.12). The columns are described at the staging models.
sources:
  - name: lake
    schema: lake
    tables:
      - name: sec_company_snapshot
        description: >
          One row per company of the universe and snapshot date; key (snapshot_date, cik).
          Source: U.S. Securities and Exchange Commission, EDGAR, https://www.sec.gov/.
      - name: sec_company_former_name
        description: >
          One row per former name of a company; key (cik, former_name, valid_from).
          Source: U.S. Securities and Exchange Commission, EDGAR, https://www.sec.gov/.
      - name: sec_filing_index
        description: >
          One row per filing and filer of one daily index file; key (index_date,
          accession_number, cik). Source: U.S. Securities and Exchange Commission, EDGAR, https://www.sec.gov/.
      - name: sec_filing_detail
        description: >
          One row per filing of a watchlist company, from the submissions document; key (cik,
          accession_number). Source: U.S. Securities and Exchange Commission, EDGAR, https://www.sec.gov/.
      - name: sec_xbrl_fact
        description: >
          One row per financial fact of a watchlist company; key (cik, taxonomy, concept, unit,
          period_start, period_end, accession_number). Source: U.S. Securities and Exchange Commission, EDGAR, https://www.sec.gov/.
