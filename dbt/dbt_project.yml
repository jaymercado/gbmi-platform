# dbt project for the ClickHouse warehouse (blueprint 7.6, 10).
name: gbmi
version: "0.0.1"
config-version: 2
profile: gbmi

require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: target
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false
