# dbt project for the ClickHouse warehouse (blueprint 7.6, 10).
name: gbmi
version: "0.0.1"
config-version: 2
profile: gbmi

require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: target
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

# Each layer lands in the ClickHouse database of the same name (blueprint 7.1); the macro
# generate_schema_name uses these names as they are.
models:
  gbmi:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
    # Operational marts are rebuilt in full on every run (blueprint 7.6).
    ops:
      +schema: ops
      +materialized: table

vars:
  # The feeds of the GDELT source: each has 96 slots in a UTC day (blueprint 8.2).
  gdelt_feeds: ["export", "mentions", "gkg"]
  slots_per_day: 96
