# Hooks call the locked tools through uv, so a commit is checked with exactly the versions
# CI uses. Install with `make setup`.
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format (check)
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        files: ^(src/|pyproject\.toml$)
      - id: sqlfluff
        name: sqlfluff lint
        entry: uv run --project dbt sqlfluff lint
        language: system
        files: ^(dbt/models|tests/integration/dbt/project/models)/.*\.sql$
        require_serial: true
      - id: uv-lock-check
        name: uv lock --check
        entry: bash -c 'uv lock --check && uv lock --check --project dbt'
        language: system
        pass_filenames: false
        files: (^|/)(pyproject\.toml|uv\.lock)$
      - id: terraform-fmt
        name: terraform fmt
        entry: bash -c 'PATH="$HOME/.local/bin:$PATH" terraform fmt -check -diff -recursive infra/terraform'
        language: system
        pass_filenames: false
        files: ^infra/terraform/.*\.(tf|tfvars)$
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
