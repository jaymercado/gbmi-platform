name: terraform

# Checks that need no AWS access. A plan job that assumes gbmi-ci-plan through OIDC is a
# stretch item of week 1 and is added once the repository and the roles exist.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt, validate, tflint, checkov
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.2"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.66.0

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: false

      - name: fmt, validate, tflint, checkov
        env:
          # tflint downloads its AWS ruleset from GitHub releases.
          GITHUB_TOKEN: ${{ github.token }}
        run: make tf-check
