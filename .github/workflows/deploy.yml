name: deploy

# Deploys one commit of main to the AWS host (blueprint 9.7; week 3 plan 3.3).
#
# Started by hand: "make deploy", or "Run workflow" in GitHub. The job waits for the approval
# of the environment prod, which accepts the branch main only. The role gbmi-ci-deploy can do
# one thing on the host: send the command document gbmi-prod-deploy with one parameter, the
# 40 characters of a commit. The script behind the document refuses a commit which is not part
# of main and a commit without an image in the registry.
#
# The log of the workflow is public. The job prints a fixed summary and never the output of
# the host; the account number is a secret of the repository, which GitHub masks.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "The 40 characters of a commit of main. Empty: the commit which the workflow runs on."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # One deployment at a time; a second one waits and is never cancelled halfway.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy a commit of main to the host
    # The job only calls AWS: it runs on the standard runner, whose image brings the AWS CLI.
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
    steps:
      - name: The commit to deploy
        id: commit
        env:
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          commit="${INPUT_COMMIT:-$GITHUB_SHA}"
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "The input commit has to be the 40 hexadecimal characters of a commit."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/gbmi-ci-deploy
          role-session-name: gbmi-deploy-${{ github.run_id }}
          aws-region: us-east-1

      - name: Send the commit to the host
        id: send
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          instance="$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=gbmi-prod-host" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          if [ -z "$instance" ] || [ "$(printf '%s' "$instance" | wc -w)" -ne 1 ]; then
            echo "Expected one running instance with the tag Name=gbmi-prod-host."
            exit 1
          fi
          echo "::add-mask::$instance"
          command="$(aws ssm send-command --document-name gbmi-prod-deploy \
            --instance-ids "$instance" --parameters "Commit=$COMMIT" \
            --comment "deploy $COMMIT" --query Command.CommandId --output text)"
          echo "instance=$instance" >> "$GITHUB_OUTPUT"
          echo "command=$command" >> "$GITHUB_OUTPUT"

      # The wait command of the AWS CLI gives up after 20 checks, 5 seconds apart. A deployment
      # with its smoke test takes longer, so the job asks in a loop of its own: one hour at most.
      - name: Wait for the host
        id: result
        env:
          INSTANCE: ${{ steps.send.outputs.instance }}
          COMMAND: ${{ steps.send.outputs.command }}
        run: |
          status="Pending"
          for attempt in $(seq 1 240); do
            status="$(aws ssm get-command-invocation --command-id "$COMMAND" \
              --instance-id "$INSTANCE" --query Status --output text 2> /dev/null || echo Pending)"
            case "$status" in
              Pending | InProgress | Delayed) sleep 15 ;;
              *) break ;;
            esac
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "attempts=$attempt" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
          STATUS: ${{ steps.result.outputs.status }}
          ATTEMPTS: ${{ steps.result.outputs.attempts }}
        run: |
          {
            echo "### Deployment"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${COMMIT:-not resolved}\` |"
            echo "| Status of the command on the host | ${STATUS:-not sent} |"
            echo "| Checks of the status, 15 seconds apart | ${ATTEMPTS:-0} |"
            echo
            echo "The output of the host is not shown here. Read it on the host, or with"
            echo "\`make host-status\` on the laptop."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${STATUS:-}" != "Success" ]; then
            echo "The deployment did not end with Success: ${STATUS:-not sent}"
            exit 1
          fi
