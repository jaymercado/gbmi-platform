name: e2e

# The acceptance criterion of phase P0 (blueprint 11.2): `make demo` passes in CI. The whole
# stack runs on the runner: the DAG tests with the interpreter of Airflow, the integration tests
# (spikes SK1 to SK3, ingestion, silver build), then the tracer and the three GDELT DAGs on the
# committed fixtures with one chart and the end-to-end assertions, and last the three drills.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: integration tests and make demo
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      UV_PYTHON_PREFERENCE: only-managed
      # CI has the demo stack only: its own Compose project, volumes and lake (week 2 plan 3.3).
      STACK: gbmi-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          enable-cache: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image with a layer cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/airflow/Dockerfile
          target: dev
          tags: gbmi-airflow:dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate .env and start the stack
        run: |
          make env
          make up-bi

      - name: DAG tests (the interpreter of Airflow inside the image)
        run: make test-dags

      - name: Integration tests (spikes SK1 to SK3, ingestion, silver build)
        run: make integration

      - name: make demo
        run: make demo

      - name: Drills DR2, DR4 and DR8 on the recorded files
        run: |
          make drill DR=2
          make drill DR=4
          make drill DR=8

      - name: Service logs
        if: failure()
        run: make logs-dump

      - name: Stop the stack
        if: always()
        run: make down
